<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告模板管理 · 智能报告流水线</title>
<style>
:root{--accent:#2563eb;--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;
      --ok:#059669;--warn:#d97706;--bad:#dc2626;--violet:#7c3aed;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.wrap{max-width:1760px;margin:0 auto;padding:24px 32px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
header h1{font-size:20px}
header .sub{color:var(--muted);font-size:12px}
header a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:12px}
.grid{display:grid;grid-template-columns:460px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical;min-height:48px}
input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;background:#fff}
button{border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:#eef2ff;color:var(--accent)}
button.danger{background:#fee2e2;color:var(--bad)}
button.okbtn{background:#d1fae5;color:var(--ok)}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px}
button:disabled{opacity:.5;cursor:not-allowed}
.tplitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.tplitem:hover{border-color:var(--accent)}
.tplitem.sel{border-color:var(--accent);box-shadow:0 0 0 2px #dbeafe}
.tplitem .q{font-size:13px;font-weight:600}
.tplitem .meta{color:var(--muted);font-size:11px;display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600}
.b-draft{background:#fef3c7;color:var(--warn)}
.b-pub{background:#d1fae5;color:var(--ok)}
.b-dep{background:#f3f4f6;color:var(--muted)}
.b-seed{background:#ede9fe;color:var(--violet)}
.chapter{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.chapter.badch{border-color:var(--bad);box-shadow:0 0 0 2px #fee2e2}
.chapter h3{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.chapter label.metric{display:inline-flex;align-items:center;gap:4px;background:#f9fafb;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
.field{margin:6px 0}
.field .fl{font-size:12px;color:var(--muted);margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#f9fafb}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.err{color:var(--bad);font-size:12px;margin-top:6px;white-space:pre-wrap}
.errlist{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--bad);margin-top:8px}
.okmsg{color:var(--ok);font-size:12px;margin-top:6px}
pre.body{background:#f9fafb;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-all}
/* ---------- 预览证据渲染（js/report-render.js 共享件所需样式，与 report.html 同款） ---------- */
.factref{background:#eef2ff;color:var(--accent);border-radius:4px;padding:0 4px;font-size:11px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.factref:hover{background:#dbeafe}
tr.facthl>td{background:#fef9c3}
.factdetail{background:#f9fafb;border-radius:6px;padding:8px;margin:4px 0;font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all}
.b-run{background:#e0e7ff;color:#4338ca}
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chartbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.chartbox .charttitle{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px}
.chartbox .chart{height:260px}
/* ---------- 顶部导航条（各演示页统一） ---------- */
.topnav{ background:#fff; border-bottom:1px solid #e3e6ea; padding:10px 28px;
  display:flex; align-items:center; gap:6px; font-size:13px; }
.topnav .brand{ font-weight:800; color:#0f172a; margin-right:16px; }
.topnav .brand .dot{ display:inline-block; width:10px; height:10px; background:#2563eb;
  border-radius:3px; margin-right:7px; }
.topnav a{ color:#475569; text-decoration:none; font-weight:600; padding:5px 13px; border-radius:999px; }
.topnav a:hover{ background:#eef2ff; color:#2563eb; }
.topnav a.cur{ background:#2563eb; color:#fff; }
</style>
</head>
<body>
<nav class="topnav">
  <span class="brand"><span class="dot"></span>智能报告流水线演示</span>
  <a href="/">NL2SQL 查询</a>
  <a href="/report.html">报告生成</a>
  <a href="/template-admin.html" class="cur">模板管理</a>
  <a href="/metric-wizard.html">指标制作向导</a>
  <a href="/dashboard.html">运行看板</a>
  <a href="/智能查数与报告流水线技术说明-lastRelease.pdf" target="_blank" rel="noopener">📄 技术说明</a>
</nav>
<div class="wrap">
<header>
  <h1>报告模板管理</h1>
  <span class="sub">列表 · 新建 · 编辑 · 保存校验 · 发布/下架 · 版本历史（服务端把关，保存=新版本 DRAFT，行不可变）</span>
  <a href="/report-usage-guide.html#template" target="_blank" rel="noopener">📖 使用说明</a>
</header>

<div class="grid">
<div>
  <div class="card">
    <h2>模板列表
      <button class="ghost mini" style="margin-left:auto" onclick="loadList()">刷新</button>
      <button class="mini" onclick="newTemplate()">＋ 新建模板</button>
    </h2>
    <div id="tplList" class="muted">加载中…</div>
  </div>
  <div class="card">
    <h2>🤖 AI 起草模板</h2>
    <div class="row" style="margin-top:0">
      <label class="metric"><input type="radio" name="draftMode" value="scene" checked onchange="setDraftMode('scene')"> 场景描述</label>
      <label class="metric"><input type="radio" name="draftMode" value="report" onchange="setDraftMode('report')"> 粘贴历史报告</label>
    </div>
    <div class="muted" id="draftHint">一句话描述场景，AI 参照指标资产起草草案（只从既有指标选，不发明；草案进编辑器人工调整后保存）。</div>
    <textarea id="draftDesc" placeholder="例：每周给资金部领导看的外汇风险情况报告，重点是外币头寸、跨境收支和大额交易"></textarea>
    <div class="row"><button id="draftBtn" onclick="doDraft()">起草（LLM，约 10~30 秒）</button></div>
    <div class="err" id="draftErr"></div>
  </div>
</div>

<div id="mainPane">
  <div class="card muted">← 从列表选择一个模板编辑，或点「新建模板」</div>
</div>
</div>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="js/report-render.js"></script>
<script>
const $ = id => document.getElementById(id);
let LIST = [], METRICS = [], CUR = null, EDIT = null, IS_NEW = false, ERRORS = [], OKMSG = '';
// 编辑器选项元数据（对比方式/周期粒度/图表种类的中文标签与约束矩阵）——来自 /templates/meta，
// 数据源是后端 ComparisonType 枚举（单一权威），前端不硬编码 token 或矩阵
let META = {comparisons:[], periodTypes:[], chartKinds:[], chartTypes:{}};
// 预览推荐周期（按业务数据边界锚定的最近完整周/月/季）——来自 /templates/preview/periods
let PPERIODS = {};

const ST = { DRAFT:['草稿','b-draft'], PUBLISHED:['已发布','b-pub'], DEPRECATED:['已下架','b-dep'] };

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

async function api(path, opts){
  const resp = await fetch('/api/report'+path, opts ? {headers:{'Content-Type':'application/json'},...opts} : undefined);
  const body = await resp.json().catch(()=>({}));
  if(!resp.ok){ const e = new Error(body.error || ('HTTP '+resp.status)); e.details = body.details||[]; throw e; }
  return body;
}

/* ---------- 列表 ---------- */
async function loadList(){
  try{
    LIST = await api('/templates');
    $('tplList').innerHTML = LIST.length ? LIST.map(t=>{
      const [lb,cls] = ST[t.latestStatus]||[t.latestStatus,'b-dep'];
      return `<div class="tplitem ${CUR===t.templateId?'sel':''}" onclick="openTpl('${t.templateId}')">
        <div class="q">${esc(t.name)} <span class="muted">${esc(t.templateId)}</span></div>
        <div class="meta">
          <span class="badge ${cls}">最新 v${t.latestVersion} ${lb}</span>
          ${t.publishedVersion?`<span class="badge b-pub">线上 v${t.publishedVersion}</span>`:'<span class="badge b-dep">未上线</span>'}
          ${t.source==='SEED'?'<span class="badge b-seed">种子</span>':''}
          <span>${esc((t.updatedAt||'').replace('T',' ').slice(0,16))}</span>
        </div></div>`;
    }).join('') : '库中暂无模板';
  }catch(e){ $('tplList').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------- 打开 / 新建 ---------- */
// 载入归一化：旧单值 comparison → comparisons 数组并清掉旧字段（校验器禁双字段同填；
// 保存即完成新旧字段迁移，语义等价——全链路读 effectiveComparisons 新优先）
function normalizeTpl(t){
  t.periodTypes = t.periodTypes || [];
  (t.chapters||[]).forEach(c=>{
    if(!c.comparisons || !c.comparisons.length) c.comparisons = c.comparison ? [c.comparison] : [];
    delete c.comparison;
  });
  return t;
}

async function openTpl(id){
  CUR = id; IS_NEW = false; ERRORS = []; OKMSG='';
  const d = await api('/templates/'+id);
  EDIT = normalizeTpl(JSON.parse(JSON.stringify(d.latest)));
  EDIT._versions = d.versions;
  render(); loadList();
}

function newTemplate(){
  CUR = null; IS_NEW = true; ERRORS = []; OKMSG='';
  EDIT = { templateId:'', name:'', keywords:[], periodTypes:[], chapters:[
    { chapterId:'ch1', title:'一、', metrics:[], comparisons:[], guidance:'', stylePrompt:'' } ] };
  EDIT._versions = [];
  render(); loadList();
}

/* ---------- 周期/对比联动 ---------- */
function effPeriods(){ return (EDIT.periodTypes && EDIT.periodTypes.length) ? EDIT.periodTypes : ['WEEK']; }
// token 是否适用当前周期组合：须对声明的每个粒度都适用（同校验器矩阵规则）
function compApplicable(mc){ return effPeriods().every(pt => mc.periodTypes.includes(pt)); }

function togglePeriod(code){
  const arr = EDIT.periodTypes;
  arr.includes(code) ? arr.splice(arr.indexOf(code),1) : arr.push(code);
  // 周期变了 → 自动剔除各章不再适用的对比 token（前端预过滤，避免提交后才报错）
  const ok = new Set(META.comparisons.filter(compApplicable).map(m=>m.token));
  EDIT.chapters.forEach(c=>{ c.comparisons = (c.comparisons||[]).filter(t=>ok.has(t)); });
  render();
}

function toggleComp(i, token){
  const arr = EDIT.chapters[i].comparisons;
  if(arr.includes(token)){ arr.splice(arr.indexOf(token),1); }
  else{
    // 同粒度环比至多一个：勾新环比自动替换旧环比（同比可与环比共存）
    const kind = (META.comparisons.find(m=>m.token===token)||{}).kind;
    if(kind==='环比'){
      const huanbi = new Set(META.comparisons.filter(m=>m.kind==='环比').map(m=>m.token));
      EDIT.chapters[i].comparisons = arr.filter(t=>!huanbi.has(t));
    }
    EDIT.chapters[i].comparisons.push(token);
  }
  render();
}

/* ---------- 编辑器渲染 ---------- */
function errAt(prefix){ return ERRORS.filter(e=>e.location===prefix || e.location.startsWith(prefix+'.') || e.location.startsWith(prefix+'[')); }

function render(){
  if(!EDIT){ $('mainPane').innerHTML = '<div class="card muted">← 从列表选择一个模板编辑，或点「新建模板」</div>'; return; }
  const chapterErr = i => errAt('chapters['+i+']');
  let chaptersHtml = EDIT.chapters.map((c,i)=>`
    <div class="chapter ${chapterErr(i).length?'badch':''}">
      <h3>章节 ${i+1}
        <button class="ghost mini" onclick="moveCh(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="ghost mini" onclick="moveCh(${i},1)" ${i===EDIT.chapters.length-1?'disabled':''}>↓</button>
        <button class="ghost mini" onclick="doPreview('${esc(c.chapterId)}')">🔍 预览本章</button>
        <button class="danger mini" style="margin-left:auto" onclick="delCh(${i})">删除本章</button>
      </h3>
      <div class="row" style="margin-top:0">
        <div class="field" style="flex:1"><div class="fl">章节标题</div><input type="text" style="width:100%" value="${esc(c.title)}" onchange="setCh(${i},'title',this.value)"></div>
      </div>
      <div class="field"><div class="fl">对比方式（选项随「适用周期」过滤；环比至多一项，可与同比共存）</div>
        ${(()=>{ const avail = META.comparisons.filter(compApplicable);
          if(!avail.length) return '<span class="muted">当前周期组合无可用对比（同时勾选多个周期时，环比不通用，仅月/季可用同比）</span>';
          return avail.map(mc=>`<label class="metric"><input type="checkbox" ${(c.comparisons||[]).includes(mc.token)?'checked':''}
            onchange="toggleComp(${i},'${mc.token}')"> ${esc(mc.label)}</label>`).join('');
        })()}</div>
      <div class="field"><div class="fl">指标（搜索 / 按业务分组勾选；悬停查看口径描述）
          <a href="#" onclick="goMakeMetric(${i});return false" style="font-size:12px;color:var(--accent);white-space:nowrap;margin-left:8px">没有想要的指标？去制作 →</a></div>
        <input type="text" style="width:260px;margin-bottom:4px" placeholder="搜索指标 id / 名称 / 描述…"
          value="${esc(MSEARCH[i]||'')}" oninput="MSEARCH[${i}]=this.value; $('msel-${i}').innerHTML=metricListHtml(${i})">
        <div id="msel-${i}">${metricListHtml(i)}</div>
      </div>
      <div class="field"><div class="fl">写作指引 guidance</div>
        <textarea onchange="setCh(${i},'guidance',this.value)">${esc(c.guidance||'')}</textarea></div>
      <div class="field"><div class="fl">✍️ 风格提示词 stylePrompt（只影响文风；数字安全由 ⑥ 审计死代码兜底）</div>
        <textarea onchange="setCh(${i},'stylePrompt',this.value)">${esc(c.stylePrompt||'')}</textarea></div>
      <div class="field"><div class="fl">📊 图表（数据由程序从 fact 绑定，LLM 零接触）</div>
        ${(c.charts||[]).map((g,j)=>{ const kind=(g.binding&&g.binding.kind)||'series';
          const kindDef = META.chartKinds.find(k=>k.kind===kind) || {types:['line','bar']};
          const bindable = c.metrics.filter(m=>chartEligible(kind,m));
          return `<div class="row" style="margin:4px 0;gap:6px;flex-wrap:wrap">
          <input type="text" style="width:170px" placeholder="图表标题" value="${esc(g.title||'')}" onchange="setChart(${i},${j},'title',this.value)">
          <select title="图表种类" onchange="setChart(${i},${j},'kind',this.value)">
            ${META.chartKinds.map(k=>`<option value="${k.kind}" ${kind===k.kind?'selected':''}>${esc(k.label)}</option>`).join('')}
          </select>
          <select title="图形" onchange="setChart(${i},${j},'type',this.value)">
            ${kindDef.types.map(t=>`<option value="${t}" ${g.type===t?'selected':''}>${esc(META.chartTypes[t]||t)}</option>`).join('')}
          </select>
          <select title="绑定指标（已按种类过滤：趋势=期间非派生无维度指标，构成=维度指标）" onchange="setChart(${i},${j},'metricId',this.value)">
            <option value="">绑定指标…</option>
            ${bindable.map(m=>{ const d=metricDef(m); return `<option value="${m}" ${(g.binding&&g.binding.metricId)===m?'selected':''}>${esc(d?d.name:m)}</option>`; }).join('')}
          </select>
          ${kind==='series'?`<input type="number" style="width:70px" min="2" max="12" placeholder="期数" title="近 N 期（2~12）"
            value="${g.binding&&g.binding.periods!=null?g.binding.periods:''}" onchange="setChart(${i},${j},'periods',this.value)">`:''}
          <button class="danger mini" onclick="delChart(${i},${j})">✕</button>
        </div>`;}).join('')}
        <button class="ghost mini" onclick="addChart(${i})">+ 加图表</button></div>
      ${chapterErr(i).map(e=>`<div class="err">✖ ${esc(e.location)}：${esc(e.message)}</div>`).join('')}
    </div>`).join('');

  const topErrs = ERRORS.filter(e=>!e.location.startsWith('chapters'));
  const versions = EDIT._versions||[];
  const draftBanner = (EDIT._unresolved&&EDIT._unresolved.length ?
      `<div class="errlist">⚠️ AI 起草未能对应的表述（不发明、不猜测，请人工处理）：<br>${EDIT._unresolved.map(esc).join('<br>')}</div>` : '')
    + (EDIT._notes&&EDIT._notes.length ? `<div class="muted" style="margin-top:6px">${EDIT._notes.map(esc).join('<br>')}</div>` : '');
  $('mainPane').innerHTML = `
  <div class="card">
    <h2>${IS_NEW?'新建模板':'编辑模板（保存 = 产生新版本 DRAFT）'}</h2>
    ${draftBanner}
    <div class="row" style="margin-top:0">
      <div class="field"><div class="fl">templateId（小写字母/数字/连字符）</div>
        <input type="text" value="${esc(EDIT.templateId)}" ${IS_NEW?'':'disabled'} onchange="EDIT.templateId=this.value"></div>
      <div class="field" style="flex:1"><div class="fl">模板名称</div>
        <input type="text" style="width:100%" value="${esc(EDIT.name)}" onchange="EDIT.name=this.value"></div>
    </div>
    <div class="field"><div class="fl">匹配关键词（逗号分隔，必填——运行期召回依赖）</div>
      <input type="text" style="width:100%" value="${esc((EDIT.keywords||[]).join('，'))}" onchange="setKeywords(this.value)"></div>
    <div class="field"><div class="fl">适用周期（不勾选 = 默认仅周报；勾选后各章「对比方式」选项随之过滤）</div>
      ${META.periodTypes.map(p=>`<label class="metric"><input type="checkbox" ${(EDIT.periodTypes||[]).includes(p.code)?'checked':''}
        onchange="togglePeriod('${p.code}')"> ${esc(p.label)}</label>`).join('')}</div>
    ${chaptersHtml}
    <div class="row"><button class="ghost" onclick="addCh()">＋ 添加章节</button></div>
    ${topErrs.length?`<div class="errlist">${topErrs.map(e=>`✖ ${esc(e.location||'-')}：${esc(e.message)}`).join('<br>')}</div>`:''}
    ${OKMSG?`<div class="okmsg">${esc(OKMSG)}</div>`:''}
    <div class="row">
      备注 <input type="text" id="remark" placeholder="版本备注（可空）" style="flex:1;min-width:140px">
      <button class="ghost" onclick="doValidate()">校验（干跑）</button>
      <button class="okbtn" onclick="doSave()">${IS_NEW?'新建（v1 DRAFT）':'保存（新版本 DRAFT）'}</button>
    </div>
    <div class="err" id="opErr"></div>
  </div>
  ${previewCard()}
  ${IS_NEW?'':versionsCard(versions)}
  <div id="versionView"></div>`;
}

/* ---------- 试生成预览（Gate3：干跑 ②③④，零落库） ---------- */
let PV = { label: null };   // 报告期输入的编辑态（跨 render 保持）

function previewCard(){
  const type = effPeriods()[0];
  const recommend = PPERIODS[type] || '';
  const hint = ['WEEK','MONTH','QUARTER'].filter(t=>PPERIODS[t])
    .map(t=>`${({WEEK:'周',MONTH:'月',QUARTER:'季'})[t]} ${PPERIODS[t]}`).join(' / ');
  return `<div class="card">
    <h2>🔍 试生成预览 <span class="muted" style="font-weight:400">干跑取数到事实/图表（零 LLM、零落库、真实数据）；改完即看，不必保存发布</span></h2>
    <div class="row" style="margin-top:0">
      报告期 <input type="text" style="width:110px" id="pvPeriod" value="${esc(PV.label || recommend)}"
        onchange="PV.label=this.value.trim()">
      <button onclick="doPreview(null)">预览全模板</button>
      <span class="muted">推荐（按库内数据边界）：${esc(hint||'不可用')}</span>
    </div>
    <div id="pvOut" style="margin-top:8px"></div>
  </div>`;
}

async function doPreview(chapterId){
  const out = $('pvOut'); if(!out) return;
  out.innerHTML = '<span class="muted">预览中（干跑取数）…</span>';
  try{
    const label = ($('pvPeriod') ? $('pvPeriod').value.trim() : '') || null;
    const r = await api('/templates/preview', {method:'POST', body: JSON.stringify(
      {template: payload().template, periodLabel: label, chapterId})});
    if(r.blocked){
      out.innerHTML = `<div class="errlist">⛔ 失败关闭（流水线在此会 BLOCKED 转人工）：<br>${esc(r.blockedReason)}</div>`;
      return;
    }
    const scope = chapterId ? `章节 ${esc(chapterId)}` : '全模板';
    out.innerHTML = `
      <div class="okmsg">✓ ${scope} · 报告期 ${esc(r.periodLabel)} · 事实 ${r.facts.length} 条 · 图表 ${(r.charts||[]).length} 张</div>
      ${(r.notes||[]).length?`<div class="muted" style="margin:4px 0">${r.notes.map(esc).join('<br>')}</div>`:''}
      ${(r.charts||[]).length?chartGridHtml(r.charts,'pvchart'):''}
      ${factsTable(r.facts)}`;
    initChartsInto(r.charts||[], 'pvchart');
  }catch(e){
    out.innerHTML = `<div class="errlist">✖ ${esc(e.message)}${(e.details&&e.details.length)
      ? '<br>'+e.details.map(d=>esc(d.location+'：'+d.message)).join('<br>') : ''}</div>`;
  }
}

function versionsCard(versions){
  return `<div class="card"><h2>版本历史（只读；被 run 引用过的版本永不物理删除）</h2>
    <table><tr><th>版本</th><th>状态</th><th>来源</th><th>创建人</th><th>时间</th><th>备注</th><th>操作</th></tr>
    ${versions.map(v=>{
      const [lb,cls] = ST[v.status]||[v.status,'b-dep'];
      return `<tr><td>v${v.version}</td><td><span class="badge ${cls}">${lb}</span></td>
        <td>${esc(v.source)}</td><td>${esc(v.createdBy||'-')}</td>
        <td>${esc((v.createdAt||'').replace('T',' ').slice(0,16))}</td><td>${esc(v.remark||'')}</td>
        <td><button class="ghost mini" onclick="viewVersion(${v.version})">查看</button>
          ${v.status==='DRAFT'?`<button class="okbtn mini" onclick="doPublish(${v.version})">发布</button>`:''}
          ${v.status!=='DEPRECATED'?`<button class="danger mini" onclick="doDeprecate(${v.version})">下架</button>`:''}
        </td></tr>`;
    }).join('')}</table>
    <div class="muted" style="margin-top:6px">发布 = DRAFT→PUBLISHED（旧线上版本自动下架，运行匹配即时生效）；下架线上版本 = 从运行匹配摘除（在跑 run 用快照不受影响）。</div>
  </div>`;
}

/* ---------- 编辑操作 ---------- */
function setCh(i,k,v){ EDIT.chapters[i][k]=v; }
function toggleMetric(i,m){
  const arr = EDIT.chapters[i].metrics;
  arr.includes(m) ? arr.splice(arr.indexOf(m),1) : arr.push(m);
}
function setKeywords(v){ EDIT.keywords = v.split(/[,，]/).map(s=>s.trim()).filter(Boolean); }
// chapterId 自动生成不再暴露（它是 fact 分组键，存量章节保留原 id 不重生成）
function nextChapterId(){
  let n = EDIT.chapters.length + 1;
  while(EDIT.chapters.some(c=>c.chapterId==='ch'+n)) n++;
  return 'ch'+n;
}
function addCh(){ EDIT.chapters.push({chapterId:nextChapterId(), title:'', metrics:[], comparisons:[], guidance:'', stylePrompt:''}); render(); }
function delCh(i){ EDIT.chapters.splice(i,1); render(); }
/* ---------- 指标选择器（搜索 + 分组 + 口径提示） ---------- */
let MSEARCH = {};   // 各章节搜索词（编辑态瞬态，不入 payload）

// 无 category 元数据的存量指标按 id 启发式兜底分组（补元数据发新版后自动切真实分组）
function heuristicCategory(m){
  const id = m.metricId || '';
  if(/loan|repay/.test(id)) return '融资与偿付';
  if(/frozen|large|in_transit|pending/.test(id)) return '风险与待办';
  if(/account|balance|deposit/.test(id)) return '账户与头寸';
  if(/txn|inflow|outflow|payroll|tax|invest/.test(id)) return '交易与收支';
  return '其他';
}

function metricTooltip(m){
  const parts = [];
  if(m.description) parts.push(m.description);
  parts.push('单位 ' + (m.unit||'-') + ' · ' + (m.timeBound?'期间指标':'快照指标')
    + (m.dimensions&&m.dimensions.length ? ' · 维度:'+m.dimensions.join('/') : '')
    + (m.derived ? ' · 派生指标' : ''));
  return parts.join('\n');
}

function metricListHtml(i){
  const c = EDIT.chapters[i];
  const q = (MSEARCH[i]||'').trim().toLowerCase();
  const hit = METRICS.filter(m => !q ||
    (m.metricId + (m.name||'') + (m.description||'')).toLowerCase().includes(q));
  if(!hit.length) return '<span class="muted">无匹配指标</span>';
  const groups = {};
  hit.forEach(m => { const g = m.category || heuristicCategory(m); (groups[g]=groups[g]||[]).push(m); });
  return Object.entries(groups).map(([g,ms])=>`<details open style="margin:2px 0">
    <summary style="cursor:pointer;font-size:12px;color:var(--muted)">${esc(g)}（${ms.length}）</summary>
    ${ms.map(m=>`<label class="metric" title="${esc(metricTooltip(m))}"><input type="checkbox" ${c.metrics.includes(m.metricId)?'checked':''}
      onchange="toggleMetric(${i},'${m.metricId}')"> ${esc(m.name)} <span class="muted">${esc(m.metricId)}</span></label>`).join('')}
  </details>`).join('');
}

/* ---------- 指标元数据辅助（图表绑定预过滤） ---------- */
function metricDef(id){ return METRICS.find(m=>m.metricId===id); }
// 与服务端 TemplateValidator 同规则：series=期间(timeBound)非派生无维度；dimension=维度指标
function chartEligible(kind, id){
  const m = metricDef(id); if(!m) return true;   // 目录缺失时不拦（交服务端校验兜底）
  const dim = !!(m.dimensions && m.dimensions.length);
  return kind==='dimension' ? dim : (m.timeBound && !m.derived && !dim);
}
/* ---------- 图表配置（P4）：写入 chapter.charts[]，schema 校验在服务端（validate/保存把关） ---------- */
function addChart(i){
  const charts = (EDIT.chapters[i].charts = EDIT.chapters[i].charts || []);
  let n = charts.length + 1;
  while(charts.some(g=>g.chartId==='chart_'+n)) n++;   // chartId 自动生成不再暴露，删中间项后避撞
  charts.push({chartId:'chart_'+n, type:'line', title:'', binding:{kind:'series', metricId:'', periods:6}});
  render();
}
function delChart(i,j){ EDIT.chapters[i].charts.splice(j,1); if(!EDIT.chapters[i].charts.length) EDIT.chapters[i].charts=null; render(); }
function setChart(i,j,k,v){
  const g = EDIT.chapters[i].charts[j];
  if(k==='chartId'||k==='title'||k==='type'){ g[k]=v; }
  else if(k==='kind'){
    g.binding.kind=v;
    if(v==='dimension'){ g.binding.periods=null; if(g.type==='line') g.type='pie'; }
    else if(g.binding.periods==null){ g.binding.periods=6; if(g.type==='pie') g.type='line'; }
    // 种类切换后原绑定指标可能不再合法（趋势/构成的适用指标集不同）→ 清空待重选
    if(g.binding.metricId && !chartEligible(v, g.binding.metricId)) g.binding.metricId='';
  }
  else if(k==='metricId'){ g.binding.metricId=v; }
  else if(k==='periods'){ g.binding.periods = v==='' ? null : parseInt(v,10); }
  render();
}
function moveCh(i,d){ const c=EDIT.chapters.splice(i,1)[0]; EDIT.chapters.splice(i+d,0,c); render(); }

function payload(){
  const t = JSON.parse(JSON.stringify(EDIT)); delete t._versions; delete t._unresolved; delete t._notes;
  // 空数组一律省略字段：periodTypes 空 → null（保持缺省 WEEK 语义）；
  // comparisons 空 → null（空数组会回退旧单值 comparison，必须省略）；旧字段 comparison 永不再写
  if(!t.periodTypes || !t.periodTypes.length) delete t.periodTypes;
  t.chapters.forEach(c=>{
    if(!c.stylePrompt) delete c.stylePrompt; if(!c.guidance) c.guidance='';
    if(!c.comparisons || !c.comparisons.length) delete c.comparisons;
    delete c.comparison;
  });
  return { template: t, createdBy: 'admin-page', remark: $('remark') ? $('remark').value : '' };
}

/* ---------- 去制作指标（P5-T5 往返联动） ---------- */
function goMakeMetric(chapterIdx){
  sessionStorage.setItem('tpl-admin-edit', JSON.stringify({EDIT, IS_NEW, CUR, chapterIdx}));
  location.href = 'metric-wizard.html?return=template-admin&chapter=' + chapterIdx;
}

/* ---------- AI 起草（P3-T2 场景模式 + Gate4 历史报告导入模式） ---------- */
let DRAFT_MODE = 'scene';
function setDraftMode(m){
  DRAFT_MODE = m;
  $('draftHint').textContent = m === 'report'
    ? '粘贴一篇过去人工写的周报/月报全文，AI 反向抽取章节结构与指标映射（映射不到的进「未能对应」清单转人工，不发明）。注意：全文会发送给 LLM。'
    : '一句话描述场景，AI 参照指标资产起草草案（只从既有指标选，不发明；草案进编辑器人工调整后保存）。';
  $('draftDesc').placeholder = m === 'report'
    ? '粘贴历史报告全文（至少 100 字；超 8000 字符自动截断）…'
    : '例：每周给资金部领导看的外汇风险情况报告，重点是外币头寸、跨境收支和大额交易';
}

async function doDraft(){
  const desc = $('draftDesc').value.trim();
  if(!desc){ $('draftErr').textContent = DRAFT_MODE==='report' ? '请先粘贴历史报告全文' : '请先写场景描述'; return; }
  $('draftBtn').disabled = true; $('draftBtn').textContent = '起草中…'; $('draftErr').textContent = '';
  try{
    const body = DRAFT_MODE==='report'
      ? {mode:'report', reportText: desc, createdBy: 'admin-page'}
      : {mode:'scene', description: desc, createdBy: 'admin-page'};
    const r = await api('/templates/draft', {method:'POST', body: JSON.stringify(body)});
    CUR = null; IS_NEW = true; ERRORS = []; OKMSG = '';
    EDIT = normalizeTpl(r.draft); EDIT._versions = []; EDIT._unresolved = r.unresolved||[]; EDIT._notes = r.notes||[];
    render(); loadList();
  }catch(e){
    $('draftErr').textContent = e.message + (e.details&&e.details.length ? '\n' + e.details.map(d=>d.location+' '+d.message).join('\n') : '');
  }finally{
    $('draftBtn').disabled = false; $('draftBtn').textContent = '起草（LLM，约 10~30 秒）';
  }
}

/* ---------- 服务端交互 ---------- */
async function doValidate(){
  ERRORS=[]; OKMSG='';
  try{
    const r = await api('/templates/validate', {method:'POST', body: JSON.stringify(payload())});
    if(r.valid){ OKMSG='✓ 校验通过（干跑，未写库）'; } else { ERRORS = r.errors; }
  }catch(e){ ERRORS = e.details.length ? e.details : [{location:'', message:e.message}]; }
  render();
}

async function doSave(){
  ERRORS=[]; OKMSG='';
  try{
    const r = IS_NEW
      ? await api('/templates', {method:'POST', body: JSON.stringify(payload())})
      : await api('/templates/'+EDIT.templateId, {method:'PUT', body: JSON.stringify(payload())});
    OKMSG = `✓ 已保存：${r.templateId} v${r.version}（${r.status}）`;
    await openTpl(r.templateId); OKMSG = `✓ 已保存：${r.templateId} v${r.version}（${r.status}）`; render();
  }catch(e){ ERRORS = e.details.length ? e.details : [{location:'', message:e.message}]; render(); }
}

async function doPublish(v){
  ERRORS=[]; OKMSG='';
  try{
    const r = await api('/templates/'+CUR+'/publish', {method:'POST', body: JSON.stringify({version:v})});
    await openTpl(r.templateId); OKMSG = `✓ 已发布 v${r.version}（旧线上版本自动下架，匹配即时生效）`; render();
  }catch(e){ ERRORS = e.details && e.details.length ? e.details : [{location:'', message:e.message}]; render(); }
}

async function doDeprecate(v){
  ERRORS=[]; OKMSG='';
  try{
    const r = await api('/templates/'+CUR+'/deprecate', {method:'POST', body: JSON.stringify({version:v})});
    await openTpl(r.templateId); OKMSG = `✓ 已下架 v${r.version}`; render();
  }catch(e){ ERRORS = e.details && e.details.length ? e.details : [{location:'', message:e.message}]; render(); }
}

async function viewVersion(v){
  const b = await api('/templates/'+CUR+'/versions/'+v);
  $('versionView').innerHTML = `<div class="card"><h2>v${b.version}（${esc(b.status)}）只读
      <button class="ghost mini" style="margin-left:auto" onclick="$('versionView').innerHTML=''">关闭</button></h2>
    <pre class="body">${esc(JSON.stringify(b.template,null,2))}</pre></div>`;
}

/* ---------- 启动 ---------- */
(async function init(){
  try{
    // 保留完整指标对象（timeBound/derived/dimensions 用于图表绑定预过滤，后续批次还要用 description/category）
    const a = await api('/assets');
    METRICS = a.metrics || [];
  }catch(e){ /* 指标目录取不到时编辑器仍可用，勾选列表为空 */ }
  try{ META = await api('/templates/meta'); }
  catch(e){ /* meta 取不到时对比/周期选项为空，保存仍由服务端校验兜底 */ }
  try{ PPERIODS = await api('/templates/preview/periods'); }
  catch(e){ /* 推荐周期取不到时预览仍可用，报告期需手填 */ }
  // 制作指标回跳：恢复编辑态 + 自动勾选新指标（目录已重拉，新发布指标已在 METRICS 中）
  const p = new URLSearchParams(location.search);
  const newMetric = p.get('newMetric');
  if(newMetric){
    try{
      const saved = JSON.parse(sessionStorage.getItem('tpl-admin-edit'));
      if(saved && saved.EDIT){
        EDIT = saved.EDIT; IS_NEW = saved.IS_NEW; CUR = saved.CUR;
        const ci = p.get('chapter') !== null && p.get('chapter') !== '' ? parseInt(p.get('chapter')) : saved.chapterIdx;
        if(ci != null && EDIT.chapters[ci] && !EDIT.chapters[ci].metrics.includes(newMetric)){
          EDIT.chapters[ci].metrics.push(newMetric);
        }
        OKMSG = '✓ 新指标 ' + newMetric + ' 已制作发布并自动勾选';
        sessionStorage.removeItem('tpl-admin-edit');
        render();
      }
    }catch(e){ /* 恢复失败则正常进列表 */ }
    history.replaceState(null, '', 'template-admin.html');
  }
  loadList();
})();
</script>
</body>
</html>
